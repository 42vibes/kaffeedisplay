name: Build illustrated avatar assets and screenshots (temporary)

on:
  push:
    branches:
      - feature/user-avatars

permissions:
  contents: write

# A single regeneration job owns the generated assets and preview screenshots.
concurrency:
  group: avatar-art-refresh
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate flash-resident artwork and web PNG images
        run: python3 tools/generate_avatar_art.py
      - name: Install SDL2 simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Generate real display screenshots
        run: make screenshots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web packages
        run: npm ci --prefix web
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Generate admin screenshots
        run: npm --prefix web run screenshots
      - name: Commit generated assets and verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/ui/src/avatar_art_generated.hpp web/src/components/avatarArt.generated.ts docs/ui/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "assets: embed 30 illustrated avatars and refresh UI previews"
            git push origin HEAD:feature/user-avatars
          fi
