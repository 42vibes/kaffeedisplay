name: Refresh fine-line coffee standby preview (temporary)
on:
  push:
    branches: [feature/animated-coffee-standby]
permissions:
  contents: write
concurrency:
  group: coffee-standby-artwork
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install build and formatting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev clang-format
      - name: Format updated C++ source
        run: |
          clang-format -i firmware/components/ui/src/standby.cpp             firmware/components/ui/src/ui_app.cpp             firmware/components/ui/src/ui_internal.hpp             firmware/components/ui/include/kaffee/ui_control.hpp             sim/src/main.cpp sim/src/click_test.cpp
      - name: Regenerate real LVGL screenshots
        run: make screenshots
      - name: Verify the three fading strands and safe wake behavior
        run: make test-ui
      - name: Verify deterministic snapshot comparison
        run: make screenshots-check
      - name: Commit updated design screenshot and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/ui/src/standby.cpp             firmware/components/ui/src/ui_app.cpp             firmware/components/ui/src/ui_internal.hpp             firmware/components/ui/include/kaffee/ui_control.hpp             sim/src/main.cpp sim/src/click_test.cpp             docs/ui/screenshots/06-coffee-standby.png
          if ! git diff --cached --quiet; then
            git commit -m "test(ui): format and capture refined steaming cup"
            git push origin HEAD:feature/animated-coffee-standby
          fi
