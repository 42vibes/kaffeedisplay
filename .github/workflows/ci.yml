name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host tests
        run: make test-host

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Size budget
        run: python3 tools/check_sizes.py
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user PyYAML==6.0.3
      - run: python3 tools/lint_openapi.py docs/api/openapi.yaml

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_docs.py

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: make fmt-check

  firmware:
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Embed web assets
        run: |
          python3 tools/embed_web.py
          python3 tools/embed_web.py --check
      - name: Build firmware
        run: |
          docker run --rm \
            -v "$PWD/firmware:/project" \
            -w /project \
            espressif/idf:release-v5.5 \
            bash -lc '. "$IDF_PATH/export.sh" && idf.py build'
      - name: Firmware and bundle size budgets
        run: python3 tools/check_sizes.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/build/*.bin
          if-no-files-found: error
