name: Regenerate size-optimized avatar art and screenshots
on:
  push:
    branches: [feature/user-avatars]
permissions:
  contents: write
concurrency:
  group: compact-avatar-art
  cancel-in-progress: true
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate embedded 38px artwork
        run: python3 tools/generate_avatar_art.py
      - name: Install simulator prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Regenerate device screenshots
        run: make screenshots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Regenerate web screenshots
        run: npm --prefix web run screenshots
      - name: Check in generated assets and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/ui/src/avatar_art_generated.hpp web/src/components/avatarArt.generated.ts docs/ui/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "assets: use compact 38px illustrations within OTA budget"
            git push origin HEAD:feature/user-avatars
          fi
