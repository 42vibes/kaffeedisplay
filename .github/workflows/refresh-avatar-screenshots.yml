name: Refresh avatar screenshots (feature branch)

# Temporary documentation-refresh job. It regenerates the actual UI screenshots
# and commits them on the development branch for review.
on:
  push:
    branches:
      - feature/user-avatars

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Build device simulator and regenerate device screenshots
        run: make screenshots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install browser for admin UI screenshots
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Regenerate browser screenshots
        run: npm --prefix web run screenshots
      - name: Commit changed preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/screenshots/0[1-5]-*.png docs/ui/screenshots/web-users.png docs/ui/screenshots/web-users-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh device and admin avatar screenshots"
            git push origin HEAD:feature/user-avatars
          else
            echo "All screenshots already match the current UI."
          fi
