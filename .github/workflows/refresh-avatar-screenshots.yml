name: Refresh avatar screenshots (feature branch)

on:
  push:
    branches:
      - feature/user-avatars

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev
      - name: Regenerate device screenshots
        run: make screenshots
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Chromium for admin screenshot preview
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Regenerate admin web screenshots
        run: npm --prefix web run screenshots
      - name: Commit preview updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/screenshots/0[1-5]-*.png docs/ui/screenshots/web-users.png docs/ui/screenshots/web-users-mobile.png docs/ui/screenshots/web-avatar-picker.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: include admin avatar picker screenshot"
            git push origin HEAD:feature/user-avatars
          fi
