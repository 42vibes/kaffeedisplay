name: Refresh random avatar screenshots (temporary)
on:
  push:
    branches: [feature/user-avatars]
permissions:
  contents: write
jobs:
  screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Generate actual admin UI previews
        run: npm --prefix web run screenshots
      - name: Commit screenshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/screenshots/web-avatar-picker.png docs/ui/screenshots/web-user-random-avatar.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: show automatic avatar assignment in admin screenshots"
            git push origin HEAD:feature/user-avatars
          fi
