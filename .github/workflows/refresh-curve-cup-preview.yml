name: Regenerate smooth coffee-cup screenshot (temporary)
on:
  push:
    branches: [feature/animated-coffee-standby]
permissions:
  contents: write
concurrency:
  group: smooth-cup-screenshot
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install simulator and formatting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev clang-format
      - name: Normalize C++ line-art source
        run: clang-format -i firmware/components/ui/src/standby.cpp
      - name: Generate LVGL screenshots
        run: make screenshots
      - name: Check simulator interaction and steam cycles
        run: make test-ui
      - name: Verify all device screenshots against source
        run: make screenshots-check
      - name: Save checked visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/ui/src/standby.cpp docs/ui/screenshots/06-coffee-standby.png
          if ! git diff --cached --quiet; then
            git commit -m "test(ui): capture smoother LVGL coffee-cup contours"
            git push origin HEAD:feature/animated-coffee-standby
          fi
