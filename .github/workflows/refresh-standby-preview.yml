name: Refresh standby simulator screenshot (temporary)
on:
  push:
    branches: [feature/animated-coffee-standby]
permissions:
  contents: write
concurrency:
  group: refresh-standby-demo
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LVGL and formatting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev clang-format
      - name: Format changed source files
        run: |
          clang-format -i firmware/components/ui/src/standby.cpp             firmware/components/ui/src/ui_app.cpp             firmware/components/ui/src/ui_internal.hpp             sim/src/click_test.cpp sim/src/main.cpp             firmware/components/ui/include/kaffee/ui_control.hpp
      - name: Regenerate real LVGL device snapshots
        run: make screenshots
      - name: Run standby interaction and wake tests
        run: make test-ui
      - name: Commit screenshot and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/components/ui/src/standby.cpp             firmware/components/ui/src/ui_app.cpp             firmware/components/ui/src/ui_internal.hpp             sim/src/click_test.cpp sim/src/main.cpp             firmware/components/ui/include/kaffee/ui_control.hpp             docs/ui/screenshots/06-coffee-standby.png
          if ! git diff --cached --quiet; then
            git commit -m "test(ui): save real LVGL coffee standby screenshot and formatting"
            git push origin HEAD:feature/animated-coffee-standby
          fi
